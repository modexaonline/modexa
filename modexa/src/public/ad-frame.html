<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Advertisement</title><base target="_blank">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}body{display:flex;justify-content:center;align-items:flex-start}</style></head>
<body><script>
/* Modexa ad frame: a real same-site page that receives the ad code from the parent and runs it with document.write,
   exactly like a normal ad-network iframe. Gives networks a real domain (not about:srcdoc) and working storage. */
(function () {
  function onMessage(e) {
    if (e.origin !== location.origin || e.source !== parent || !e.data || e.data.type !== 'modexa-ad') return;
    removeEventListener('message', onMessage);
    var css = '<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}body{display:flex;justify-content:center;align-items:flex-start}</style>';
    document.open();
    document.write('<!doctype html><html><head><meta charset="utf-8"><base target="_blank">' + css + '</head><body>' + e.data.code + '</body></html>');
    document.close();
  }
  addEventListener('message', onMessage);
})();
</script></body></html>
